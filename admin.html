<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9A2 - Thống kê truy cập</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #18212f;
        }
        .ip-location {
        line-height: 1.4;
        }

        .ip-location small {
        color: #687386;
        }

        .loading-location {
            color: #999;
            font-size: 13px;
        }
        .wrap { max-width: 1200px; margin: auto; }
        h1 { margin-bottom: 8px; }
        .muted { color: #687386; }
        .login, .panel, .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        .login {
            max-width: 500px;
            margin: 80px auto;
            padding: 28px;
        }
        input, button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d6dce5;
            font-size: 15px;
        }
        button {
            margin-top: 10px;
            border: 0;
            cursor: pointer;
            background: #18212f;
            color: white;
        }
        #error { color: #c62828; min-height: 24px; }
        .hidden { display: none !important; }
        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin: 24px 0;
        }
        .card { padding: 24px; }
        .card small { color: #687386; }
        .number { font-size: 38px; font-weight: 700; margin-top: 8px; }
        .panel { padding: 20px; margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid #edf0f4; }
        th { color: #566174; font-size: 13px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .refresh { width: auto; padding: 10px 16px; margin: 0; }
        @media (max-width: 650px) {
            body { padding: 16px; }
            .cards { grid-template-columns: 1fr; }
            .topbar { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div id="loginBox" class="login">
        <h1>Thống kê 9A2</h1>
        <p class="muted">Trang quản trị lượt truy cập.</p>
        <input id="token" type="password" placeholder="Nhập mã quản trị">
        <button id="loginButton">Xem thống kê</button>
        <p id="error"></p>
    </div>

    <main id="dashboard" class="hidden">
        <div class="topbar">
            <div>
                <h1>Thống kê truy cập 9A2</h1>
                <p class="muted">Dữ liệu được lấy trực tiếp từ Cloudflare D1.</p>
            </div>
            <button id="refreshButton" class="refresh">↻ Làm mới</button>
        </div>

        <section class="cards">
            <div class="card">
                <small>TỔNG LƯỢT TRUY CẬP</small>
                <div id="totalVisits" class="number">0</div>
            </div>
            <div class="card">
                <small>TỔNG IP KHÁC NHAU</small>
                <div id="totalIPs" class="number">0</div>
            </div>
        </section>

        <section class="panel">
            <h2>IP truy cập nhiều nhất</h2>
            <table>
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Khu vực</th>
                        <th>Nhà mạng</th>
                        <th>Số lần vào</th>
                        <th>Lần đầu</th>
                        <th>Lần cuối</th>
                    </tr>
                </thead>
                <tbody id="visitorsBody"></tbody>
            </table>
        </section>

        <section class="panel">
            <h2>100 lượt truy cập gần nhất</h2>
            <table>
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Thời gian</th>
                        <th>Trang</th>
                    </tr>
                </thead>
                <tbody id="recentBody"></tbody>
            </table>
        </section>
    </main>
</div>

<script>
const tokenInput = document.querySelector("#token");
const loginBox = document.querySelector("#loginBox");
const dashboard = document.querySelector("#dashboard");
const errorBox = document.querySelector("#error");
const loginButton = document.querySelector("#loginButton");
const refreshButton = document.querySelector("#refreshButton");

let adminToken = "";

function formatDate(value) {
    if (!value) return "-";
    return new Date(value).toLocaleString("vi-VN");
}

async function loadStats() {
    errorBox.textContent = "";

    try {
        const response = await fetch("/api/stats", {
            headers: {
                Authorization: `Bearer ${adminToken}`
            }
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(data.error || "Không thể tải thống kê.");
        }

        document.querySelector("#totalVisits").textContent =
            data.totalVisits.toLocaleString("vi-VN");

        document.querySelector("#totalIPs").textContent =
            data.totalUniqueIPs.toLocaleString("vi-VN");

        document.querySelector("#visitorsBody").innerHTML =
            data.visitors.map(visitor => `
                <tr>
                    <td>${escapeHtml(visitor.ip)}</td>
                    <td>${visitor.visit_count}</td>
                    <td>${formatDate(visitor.first_seen)}</td>
                    <td>${formatDate(visitor.last_seen)}</td>
                </tr>
            `).join("") || `
                <tr><td colspan="4">Chưa có dữ liệu.</td></tr>
            `;

document.querySelector("#visitorsBody").innerHTML =
    data.visitors.map(visitor => `
        <tr>
            <td>${escapeHtml(visitor.ip)}</td>

            <td id="location-${encodeURIComponent(visitor.ip)}">
                <span class="loading-location">Đang tra...</span>
            </td>

            <td id="isp-${encodeURIComponent(visitor.ip)}">
                <span class="loading-location">Đang tra...</span>
            </td>

            <td>${visitor.visit_count}</td>
            <td>${formatDate(visitor.first_seen)}</td>
            <td>${formatDate(visitor.last_seen)}</td>
        </tr>
    `).join("") || `
        <tr><td colspan="6">Chưa có dữ liệu.</td></tr>
    `;

data.visitors.forEach(visitor => {
    lookupIP(visitor.ip);
});

    } catch (error) {
        errorBox.textContent = error.message;
        if (error.message.includes("quyền")) {
            dashboard.classList.add("hidden");
            loginBox.classList.remove("hidden");
        }
    }
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function lookupIP(ip) {
    const key = encodeURIComponent(ip);

    try {
        const response = await fetch(
            `https://ipapi.co/${encodeURIComponent(ip)}/json/`
        );

        const data = await response.json();

        const location = [
            data.city,
            data.region,
            data.country_name
        ].filter(Boolean).join(", ");

        document.querySelector(`#location-${key}`).innerHTML =
            escapeHtml(location || "Không xác định");

        document.querySelector(`#isp-${key}`).innerHTML =
            escapeHtml(data.org || data.asn || "Không xác định");

    } catch (error) {
        document.querySelector(`#location-${key}`).textContent =
            "Không tra được";

        document.querySelector(`#isp-${key}`).textContent =
            "Không tra được";
    }
}

loginButton.onclick = async () => {
    adminToken = tokenInput.value.trim();

    if (!adminToken) {
        errorBox.textContent = "Hãy nhập mã quản trị.";
        return;
    }

    await loadStats();

    if (!errorBox.textContent) {
        loginBox.classList.add("hidden");
        dashboard.classList.remove("hidden");
    }
};

refreshButton.onclick = loadStats;

tokenInput.addEventListener("keydown", event => {
    if (event.key === "Enter") loginButton.click();
});
</script>
</body>
</html>
